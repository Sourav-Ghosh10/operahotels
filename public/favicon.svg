<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Dark navy background -->
  <rect width="100" height="100" fill="#0d1b2a"/>
  
  <!-- Opera Grand Hotel emblem: crown + intertwined OG loops in gold -->
  <g transform="translate(50, 50)">
    
    <!-- Crown top: three spires -->
    <line x1="0" y1="-42" x2="0" y2="-34" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-11" y1="-38" x2="-9" y2="-32" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="-38" x2="9" y2="-32" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>
    <!-- Crown dots -->
    <circle cx="0" cy="-44" r="2.5" fill="#c9a96e"/>
    <circle cx="-12" cy="-40" r="1.8" fill="#c9a96e"/>
    <circle cx="12" cy="-40" r="1.8" fill="#c9a96e"/>

    <!-- Left loop of the OG intertwined monogram -->
    <path d="
      M 0,-28
      C -12,-28 -22,-20 -22,-8
      C -22,4 -12,12 0,12
      C 8,12 15,8 18,2
      C 14,-2 10,-4 6,-2
      C 4,2 0,4 -4,4
      C -10,4 -14,0 -14,-8
      C -14,-16 -8,-20 0,-20
      C 6,-20 10,-16 12,-12
      C 16,-16 18,-22 14,-28
      C 10,-32 5,-28 0,-28
      Z
    " fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Right loop -->
    <path d="
      M 0,-28
      C 12,-28 22,-20 22,-8
      C 22,4 12,12 0,12
    " fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bottom flourish -->
    <path d="M -6,28 Q 0,36 6,28" fill="none" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="0" y2="28" stroke="#c9a96e" stroke-width="2" stroke-linecap="round"/>
    
  </g>
</svg>
